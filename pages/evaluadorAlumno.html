<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluador de Alumnos</title>
    <link rel="stylesheet" href="../styles/evaluadorAlumno.css">
    <script src="../js/evaluadorAlumno.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>Evaluador de alumnos</h1>
        <p>Fundamentos de js</p>
    </main>

    <section class="card">
        <h2>Evaluar calificación</h2>
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" placeholder="Nombre del alumno">
        <label for="calificacion">Calificación</label>
        <input id="calificacion" type="number" min="0" max="10" step="0.1" placeholder="Ingresa tu calificación">
        <button id="evaluar">Evaluar</button>
        <p id="resultado"></p>
    </section>

</body>

</html>
