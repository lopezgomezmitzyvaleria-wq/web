<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de acceso</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../js/registroTransporte.js" defer></script>
</head>

<body>
    <main class="contenedor" id="home">
        <h1>Registrar transporte</h1>
        <p id="mensaje" aria-live="polite"></p>
        <section class="panel">
            <form id="formTransporte">
    <div class="campo-grupo">
        <label for="tipo_transporte_id">Tipo de Transporte</label>
        <div class="contenedor">
            <select id="tipo_transporte_id" name="tipo_transporte_id" required>
                <option value="" disabled selected>Selecciona un tipo de transporte</option>
                <option value="1">Autobús</option>
                <option value="4">Avión</option>
                <option value="2">Camioneta</option>
                <option value="5">Lancha</option>
                <option value="3">Microbús</option>
            </select>
        </div>
    </div>

    <div class="campo-grupo">
        <label for="nombre_chofer">Nombre del Chofer</label>
        <input type="text" id="nombre_chofer" name="nombre_chofer" required placeholder="Ej. Juan Pérez">
    </div>

    <div class="campo-grupo">
        <label for="capacidad_max">Capacidad Máxima del Transporte</label>
        <input type="number" id="capacidad_max" name="capacidad_max" min="1" required placeholder="Ej. 12">
    </div>

    <div class="campo-grupo">
        <label for="placa">Placa</label>
        <input type="text" id="placa" name="placa" required placeholder="Ej. 189-UNAM-3">
    </div>

    <div class="campo-grupo">
        <label for="empresa">Empresa</label>
        <input type="text" id="empresa" name="empresa" required placeholder="Ej. Transportes México">
    </div>

    <button type="submit">Registrar Transporte</button>
</form>
        </section>

        <button type="button" id="cargarTransportes">Ver Transportes Registrados</button>

        <p id="estadoTransportes"></p>

        <div id="contenedorTransportes"></div>

        <button type="button" id="regresar">Regresar</button>

    </main>
</body>

</html>
