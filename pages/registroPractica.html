<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de acceso</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../js/registroPractica.js" defer></script>
</head>

<body>
    <main class="contenedor" id="home">
        <h1>Registrar alumnos</h1>
        <p id="mensaje" aria-live="polite"></p>
        <section class="panel">
            <form id="formTransporte">
                <label for="transporte_id">transporte_id</label>
                <input type="number" id="transporte_id" required>

                <label for="tipo_transporte_id">tipo_transporte_id</label>
                <input type="number" id="tipo_transporte_id" required>

                <label for="nombre_chofer">nombre_chofer</label>
                <input type="text" id="nombre_chofer" required>

                <label for="capacidad_max">capacidad_max</label>
                <input type="number" id="capacidad_max" required>

                <label for="placa">placa</label>
                <input type="text" id="placa" required>

                <label for="empresa">empresa</label>
                <input type="text" id="empresa" required>

                <button type="submit">Registrar</button>
            </form>
        </section>

    </main>
</body>

</html>
