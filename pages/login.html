<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../styles/style.css">
    <script src="../js/login.js" defer></script>
</head>
<body>
     <section class="panel">
            <h2>Iniciar sesión</h2>

            <form id="formLogin">
                <label for="correoLogin">Correo electrónico</label>
                <input id="correoLogin" type="email" required>

                <label for="passwordLogin">Contraseña</label>
                <input id="passwordLogin" type="password" required>

                <button id="sesion" type="submit">Iniciar sesión</button>
            </form>
        </section>
        <section class="panel">
            <p id="mensaje" aria-live="polite">Sin actividad.</p>>
        </section>

        
</body>
</html>
